[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-reproduction-lab"
version = "0.1.0"
description = "Honest, deterministic scoped reproduction studies"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Yuxin Chen"}]
keywords = ["reproducibility", "retrieval", "calibration", "agents", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema>=4.23,<5",
  "numpy>=1.26,<3",
  "pydantic>=2.10,<3",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "hypothesis>=6.120,<7",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
  "types-jsonschema>=4.23,<5",
]

[project.scripts]
paper-repro = "paper_reproduction_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper_reproduction_lab = ["schemas/*.json", "py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/paper_reproduction_lab"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
